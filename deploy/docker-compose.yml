# Dev-only data services for tds_v2. The app itself (Laravel/Octane,
# traffic-core) runs natively on the host during development — see
# docs/ARCHITECTURE_PLAN.md for why (mirrors Keitaro's hybrid pattern).
# This is a SEPARATE, fresh database from the old project's tds-mysql —
# never point new code at production data during development.
services:
  mysql:
    image: mysql:8.0
    container_name: tds2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tds2
      MYSQL_USER: tds2
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - tds2_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: tds2-redis
    ports:
      - "6380:6379"

  # Phase 15 — consumes the Redis-backed click queue `StoreRawClickStage`
  # now RPUSHes onto instead of inserting into `clicks` synchronously.
  # Built from `tds2-php-dev` (see Dockerfile.dev-php) so it shares the
  # exact same PHP build/extensions as everything else in this project.
  # Not started by default outside this compose file — bring it up
  # explicitly with `docker compose --profile worker up` once
  # `tds2-php-dev` has been built locally (`docker build -t tds2-php-dev
  # -f deploy/Dockerfile.dev-php deploy/`).
  traffic-core-worker:
    image: tds2-php-dev:latest
    container_name: tds2-traffic-core-worker
    profiles: ["worker"]
    working_dir: /app
    volumes:
      - ../traffic-core:/app
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: tds2
      DB_USERNAME: tds2
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["php", "bin/process_click_queue.php"]
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # Phase 16 — persistent php-fpm pool for the `local_file` action's
  # PHP execution, preferred over spawning a fresh `php-cgi` per request
  # (Phase 8's tier, `LocalFileSandbox` falls back to it automatically if
  # this pool isn't reachable). Same opt-in pattern as
  # `traffic-core-worker`: `docker compose --profile fpm up`.
  #
  # IMPORTANT: whatever process actually runs `traffic-core/public/
  # index.php` must mount the SAME landings folder at the SAME absolute
  # path this container uses (`/landings` here) — `cgi-fcgi` only
  # forwards a `SCRIPT_FILENAME` string over the wire, this container
  # opens that path on ITS OWN filesystem, not the caller's. In a real
  # (non-per-service-container) deployment both sides share one host
  # filesystem and this is a non-issue; it only matters for this
  # Docker-Compose-per-service dev setup. Set `PHP_FPM_HOST=traffic-core-
  # php-fpm PHP_FPM_PORT=9070` (matching `listen` in the pool conf below)
  # on whatever runs `index.php` to actually use this pool.
  traffic-core-php-fpm:
    image: tds2-php-dev:latest
    container_name: tds2-traffic-core-php-fpm
    profiles: ["fpm"]
    working_dir: /app
    volumes:
      - ../traffic-core:/app
      - ../backend/lander:/landings
      - ./php-fpm-local-file-pool.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    ports:
      - "9070:9070"
    command: ["php-fpm", "-F", "-y", "/usr/local/etc/php-fpm.d/www.conf"]
    restart: unless-stopped

  # Headless-Chrome screenshot service for the landing/offer preview-image
  # feature (backend/app/Services/PreviewImageService.php). Legacy's own
  # `PreviewImageService::createPreview()` was already a disabled no-op
  # (external `screenshot.tds24.ru` vendor service, intentionally turned
  # off — see the legacy source's own docblock) with a documented "own
  # local headless-browser implementation is planned" TODO never acted
  # on — this is that implementation, built fresh (no legacy behavior to
  # port, since legacy never actually had one running).
  #
  # `chromedp/headless-shell` (official, from the well-known chromedp Go
  # project) already listens on 9222 by default via its own entrypoint —
  # the ONLY flag added here is `--remote-allow-origins=*`, required
  # because Chrome's own CDP handshake otherwise rejects a WebSocket
  # connection whose Origin header doesn't match its own host (confirmed
  # live: a 403 "Rejected an incoming WebSocket connection" without it).
  # Same opt-in pattern as `traffic-core-worker`/`traffic-core-php-fpm`:
  # `docker compose --profile screenshot up`.
  screenshot:
    image: chromedp/headless-shell:latest
    container_name: tds2-screenshot
    profiles: ["screenshot"]
    ports:
      - "9222:9222"
    command: ["--remote-allow-origins=*"]
    restart: unless-stopped

volumes:
  tds2_mysql_data:
