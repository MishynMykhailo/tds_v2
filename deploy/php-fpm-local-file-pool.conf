; php-fpm pool for traffic-core's `local_file` action — Phase 16.
;
; Legacy's real preferred path (`Traffic\HitLimit\...` — no, wrong file;
; see `Core\Sandbox\CgiExecutor\FcgiExecutor`/`SandboxFactory::create()`)
; talks to an already-running php-fpm pool through the `cgi-fcgi` bridge
; binary rather than spawning a fresh PHP interpreter per request (that's
; the `CgiExecutor`/`php-cgi` fallback path, Phase 8). This pool is that
; same persistent-worker side for traffic-core.
;
; Hardening note (deviation from the per-process CGI path, documented,
; not accidental): `LocalFileSandbox`'s CGI path sets `disable_functions`/
; `open_basedir` via `-d` flags PER REQUEST, scoped to that one landing's
; own folder — possible because a fresh `php-cgi` process is spawned each
; time. A shared FPM pool can't accept per-request `-d` overrides from
; `cgi-fcgi` (it's a protocol bridge, not a process the caller controls) —
; `disable_functions` transfers cleanly as a static pool setting, but
; `open_basedir` here is scoped to the WHOLE landings storage root, not
; the current request's specific folder. A landing page's PHP served by
; the pooled path could therefore read OTHER landings' files, which the
; per-process CGI path prevents — still strictly better than legacy
; (which hardens neither path at all), just less granular. Pick the CGI
; path instead (unset `PHP_FPM_HOST`, or don't run this pool) if
; per-folder isolation matters more than pool throughput.
;
; SECOND, more important hardening gap (found live, not assumed):
; `LocalFileSandbox`'s per-request timeout kills the `cgi-fcgi` BRIDGE
; process (proc_terminate), which only disconnects the client from the
; pool — it does NOT stop the pool WORKER still executing the request.
; Live-verified: a `sleep(5)` landing with `lp_php_timeout=1` correctly
; returns "Timed out" to the visitor in ~1s (confirmed via `time curl`),
; but the underlying worker keeps sleeping for the full 5s regardless —
; PHP does not poll for client disconnection during a blocking sleep().
; The CGI tier has no such gap (killing that process stops the actual
; interpreter). `request_terminate_timeout` below is the fix: a STATIC,
; pool-wide ceiling (php-fpm itself SIGTERMs/SIGKILLs a worker that
; exceeds it) — independent of the dynamic, DB-configurable
; `lp_php_timeout` setting, which can't be pushed into a per-request FPM
; override for the same reason `open_basedir` can't be. Set generously
; above any real `lp_php_timeout` value in use; a landing configured
; with a shorter `lp_php_timeout` still returns to the visitor quickly
; (already proven), but its pool worker may keep running for up to this
; ceiling before FPM force-kills it — a real, now-bounded, documented
; limitation of the pooled tier, not a silent one.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9070
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no
request_terminate_timeout = 30s

php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,proc_close,pcntl_exec,pcntl_fork
; `/app/bin` (the mounted `traffic-core/bin/`) must stay reachable too —
; `SCRIPT_FILENAME` always points at `bin/execute_local_file.php`
; (the actual landing file path travels inside the `params` POST body,
; not as the CGI script path — see that file's own docblock), and FPM's
; open_basedir restricts even loading the initial script, unlike CLI SAPI.
php_admin_value[open_basedir] = /landings:/tmp:/app/bin
